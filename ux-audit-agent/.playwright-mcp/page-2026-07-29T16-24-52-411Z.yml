          - paragraph [ref=e81]: AI increases what teams can create, but it also raises the bar for clarity and coordination. At Linear, we are building the tools for this new era of product development. A purpose-built system where teams and agents operate together in a shared, structured environment.
          - paragraph [ref=e82]: Founded in 2019, Linear has become the tool of choice for more than 37,000 companies (including OpenAI, Coinbase, and Ramp) to plan, build, and ship their products.
